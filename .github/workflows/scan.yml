name: Daily biotech scan

on:
  schedule:
    # 06:00 UTC = 07:00 UK in summer (BST). Cron has no DST awareness; adjust
    # to '0 7 * * *' in winter if you want it pinned to 07:00 local year-round.
    - cron: "0 6 * * *"
  workflow_dispatch:      # lets you trigger a run manually from the Actions tab
    inputs:
      lookback_days:
        description: "Lookback window in days (leave blank for the normal daily default of 2 -- only widen this for a one-off backfill, and check dry_run_count.py's cost estimate first). Ignored if incorporated_from/incorporated_to are set below."
        required: false
        default: ""
      incorporated_from:
        description: "Fixed backfill window start, YYYY-MM-DD (must be set together with incorporated_to; overrides lookback_days entirely)"
        required: false
        default: ""
      incorporated_to:
        description: "Fixed backfill window end, YYYY-MM-DD (must be set together with incorporated_from)"
        required: false
        default: ""
      enable_web_search:
        description: "Set to 1 to enable the gated web-search enrichment pass for this run (real cost -- see WEB_SEARCH_SPEC.md). Leave blank to use the repo's SCANNER_FETCH_WEB_SEARCH variable, or default off."
        required: false
        default: ""

permissions:
  contents: write          # allow the job to commit digests back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          CH_API_KEY: ${{ secrets.CH_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # ORCID enrichment needs these to authenticate -- without them it
          # degrades gracefully (skips ORCID, logs why) rather than failing,
          # but that means it silently does nothing unless these secrets are
          # added in the repo's Settings -> Secrets and variables -> Actions.
          # GtR needs no secret at all, so it always runs regardless.
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
          # Falls back to '2' (the normal daily window) whenever no input is
          # given -- covers both the scheduled cron trigger (which has no
          # inputs at all) and a manual trigger left at its blank default.
          SCANNER_LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '2' }}
          # Blank unless both are filled in on a manual trigger -- fetch.py
          # raises if only one is set, and ignores LOOKBACK_DAYS entirely if
          # both are set (see scanner/config.py).
          SCANNER_INCORPORATED_FROM: ${{ github.event.inputs.incorporated_from || '' }}
          SCANNER_INCORPORATED_TO: ${{ github.event.inputs.incorporated_to || '' }}
          # Real cost, off by default -- see WEB_SEARCH_SPEC.md. A manual-run
          # input takes priority; otherwise falls back to a repo variable
          # (Settings -> Secrets and variables -> Actions -> Variables) so you
          # can turn it on permanently once you trust it, without editing this
          # file; otherwise off.
          SCANNER_FETCH_WEB_SEARCH: ${{ github.event.inputs.enable_web_search || vars.SCANNER_FETCH_WEB_SEARCH || '0' }}
        run: python run.py

      - name: Commit digests
        run: |
          git config user.name "biotech-scanner-bot"
          git config user.email "actions@github.com"
          git add data digests
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily scan: $(date -u +%Y-%m-%d)"
            git push
          fi

# GitHub automatically emails the repository owner when a *scheduled* workflow
# fails, so run.py exiting non-zero already gives you failure alerts for free.
# For a custom email (e.g. the daily hot-list), add an SMTP step such as
# dawidd6/action-send-mail@v3 with mail server secrets.
